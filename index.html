<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Just a little leisure</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: monospace;
        }
        #gameContainer {
            max-width: 450px;
            height: 100dvh;
            margin: 0 auto;
            border-left: 2px solid #222;
            border-right: 2px solid #222;
            position: relative;
        }
        #topBar {
            background: #222;
            color: #fff;
            height: 45px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 14px;
            border-bottom: 2px solid #444;
            z-index: 10;
        }
        #regionSelector {
            background: #444;
            color: #fff;
            border: 1px solid #666;
            padding: 4px 8px;
            font-family: monospace;
            font-size: 14px;
            outline: none;
        }
        #canvasWrapper {
            position: absolute;
            top: 45px;
            bottom: 0;
            left: 0;
            right: 0;
            background: #2c3e50;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #dpad {
            position: absolute;
            bottom: 65px;
            left: 20px;
            width: 160px;
            height: 160px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            z-index: 10;
        }
        .dbtn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .dbtn:active {
            background: rgba(255, 255, 255, 0.5);
        }
        #btnUp { grid-column: 2; grid-row: 1; }
        #btnLeft { grid-column: 1; grid-row: 2; }
        #btnRight { grid-column: 3; grid-row: 2; }
        #btnDown { grid-column: 2; grid-row: 3; }
        #interactBtn {
            position: absolute;
            bottom: 65px;
            right: 20px;
            width: 75px;
            height: 75px;
            background: rgba(230, 126, 34, 0.8);
            border: 2px solid #d35400;
            border-radius: 50%;
            color: white;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #interactBtn:active {
            background: rgba(211, 84, 0, 1);
        }
        #whistleBtn {
            position: absolute;
            bottom: 155px;
            right: 20px;
            z-index: 10;
        }
        #openCodexBtn {
            position: absolute;
            top: 60px;
            left: 15px;
            z-index: 10000;
        }
        #settingsBtn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10000;
            font-size: 14px;
            padding: 8px 14px;
        }
        .utilBtn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            color: #fff;
            padding: 8px 14px;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .utilBtn:active {
            background: rgba(255, 255, 255, 0.4);
        }
        #devPanel {
            display: none;
            position: absolute;
            top: 100px;
            left: 30px;
            right: 30px;
            background: rgba(30, 30, 30, 0.95);
            border: 2px dashed #e74c3c;
            border-radius: 10px;
            padding: 15px;
            z-index: 100000;
            color: white;
            flex-direction: column;
            gap: 10px;
        }
        .devRow {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .devBtn {
            flex: 1;
            background: #c0392b;
            color: white;
            border: none;
            padding: 8px;
            font-family: monospace;
            font-weight: bold;
            border-radius: 4px;
            font-size: 11px;
        }
        .devBtn:active {
            background: #e74c3c;
        }
        #gameContainer {
            max-width: 450px;
            height: 100vh;
            margin: 0 auto;
            border-left: 2px solid #222;
            border-right: 2px solid #222;
            position: relative;
        }

        #codexList {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .codexEntry {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .codexCanvasView {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #555;
            border-radius: 6px;
            width: 70px;
            height: 70px;
            flex-shrink: 0;
        }
        .codexInfo {
            font-size: 12px;
            line-height: 1.5;
        }
        .codexTamed { color: #2ecc71; font-weight: bold; }
        .codexWild { color: #95a5a6; font-weight: bold; }
        .codexWild { color: #95a5a6; font-weight: bold; }
        .codexWild { color: #95a5a6; font-weight: bold; }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="topBar">
        <div>🎒 Food: <span id="lblFood">0</span> | Water: <span id="lblWater">0</span></div>
        <div>
            🗺️ <select id="regionSelector">
                <option value="1">Region 1</option>
                <option value="2">Region 2</option>
                <option value="3">Region 3</option>
            </select>
        </div>
    </div>

    <div id="canvasWrapper">
        <canvas id="gameCanvas"></canvas>

        <button id="openCodexBtn" class="utilBtn">🎒 PETS</button>
        <button id="settingsBtn" class="utilBtn">⚙️</button>
        <button id="whistleBtn" class="utilBtn">WHISTLE</button>

        <div id="devPanel">
            <div style="display: flex; justify-content: space-between; font-weight: bold; border-bottom: 1px solid #444; padding-bottom: 4px;">
                <span>🛠️ DEV CONSOLE</span>
                <span id="closeDev" style="color: #e74c3c; cursor: pointer;">[X]</span>
            </div>
            <div class="devRow">
                <button id="devAddFood" class="devBtn">+50 FOOD</button>
                <button id="devAddWater" class="devBtn">+50 WATER</button>
            </div>
            <button id="devInstaTame" class="devBtn" style="background: #27ae60;">⭐ INSTA-TAME / LEVEL UP</button>
        </div>

        <div id="codexOverlay">
            <div id="codexHeader">
                <h2>🐾 PETS CODEX</h2>
                <button id="codexClose">X</button>
            </div>
            <div id="codexList">
                <div class="codexEntry">
                    <canvas id="viewDog" class="codexCanvasView"></canvas>
                    <div>
                        <div id="infoDog" class="codexInfo"></div>
                        <div id="renameBoxDog" style="margin-top: 6px; display: none;">
                            <input type="text" id="inputDog" placeholder="New Name" style="width: 80px; font-size: 10px;">
                            <button id="btnRenameDog" style="font-size: 10px; padding: 2px 6px;">Set</button>
                        </div>
                    </div>
                </div>
                <div class="codexEntry">
                    <canvas id="viewElephant" class="codexCanvasView"></canvas>
                    <div>
                        <div id="infoElephant" class="codexInfo"></div>
                        <div id="renameBoxElephant" style="margin-top: 6px; display: none;">
                            <input type="text" id="inputElephant" placeholder="New Name" style="width: 80px; font-size: 10px;">
                            <button id="btnRenameElephant" style="font-size: 10px; padding: 2px 6px;">Set</button>
                        </div>
                    </div>
                </div>
                <div class="codexEntry">
                    <canvas id="viewSquirrel" class="codexCanvasView"></canvas>
                    <div>
                        <div id="infoSquirrel" class="codexInfo"></div>
                        <div id="renameBoxSquirrel" style="margin-top: 6px; display: none;">
                            <input type="text" id="inputSquirrel" placeholder="New Name" style="width: 80px; font-size: 10px;">
                            <button id="btnRenameSquirrel" style="font-size: 10px; padding: 2px 6px;">Set</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="dpad">
            <div id="btnUp" class="dbtn">▲</div>
            <div id="btnLeft" class="dbtn">◀</div>
            <div id="btnRight" class="dbtn">▶</div>
            <div id="btnDown" class="dbtn">▼</div>
        </div>
        <div id="interactBtn">GIVE</div>
    </div>
</div>

<script>

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const lblFood = document.getElementById('lblFood');
const lblWater = document.getElementById('lblWater');
const regionSelector = document.getElementById('regionSelector');

const levelRequirements = {
    dog: [
        { food: 5, water: 5 },
        { food: 10, water: 10 },
        { food: 20, water: 20 },
        { food: 50, water: 50 }
    ],
    elephant: [
        { food: 50, water: 30 },
        { food: 100, water: 60 },
        { food: 200, water: 120 },
        { food: 500, water: 300 }
    ],
    squirrel: [
        { food: 20, water: 10 },
        { food: 40, water: 20 },
        { food: 80, water: 40 },
        { food: 200, water: 100 }
    ]
};

let currentRegion = 1;
let spawnTimer = 0;
let lastTime = 0;
const targetFPS = 60;
const frameInterval = 1000 / targetFPS;

const input = { up: false, down: false, left: false, right: false };
const inventory = { food: 0, water: 0 };

function updateUI() {
    lblFood.textContent = inventory.food;
    lblWater.textContent = inventory.water;
}
class Player {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = 32;
        this.speed = 180;
    }

    update(dt) {
        let dx = 0;
        let dy = 0;
        if (input.up) dy -= 1;
        if (input.down) dy += 1;
        if (input.left) dx -= 1;
        if (input.right) dx += 1;

        if (dx !== 0 && dy !== 0) {
            dx *= 0.7071;
            dy *= 0.7071;
        }

        let nextX = this.x + dx * this.speed * dt;
        let nextY = this.y + dy * this.speed * dt;

        let padding = 30; 
        if (nextX >= padding && nextX <= canvas.width - this.size - padding) {
            this.x = nextX;
        }
        if (nextY >= padding && nextY <= canvas.height - this.size - padding) {
            this.y = nextY;
        }
    }

    draw() {
        ctx.fillStyle = '#664227'; 
        ctx.beginPath();
        ctx.arc(this.x + 16, this.y + 10, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(this.x + 6, this.y + 10, 20, 10);

        ctx.fillStyle = '#ffcc99'; 
        ctx.beginPath();
        ctx.arc(this.x + 16, this.y + 13, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000000'; 
        ctx.fillRect(this.x + 13, this.y + 11, 2, 3);
        ctx.fillRect(this.x + 18, this.y + 11, 2, 3);

        ctx.fillStyle = '#ffffff'; 
        ctx.beginPath();
        ctx.moveTo(this.x + 10, this.y + 20);
        ctx.lineTo(this.x + 22, this.y + 20);
        ctx.lineTo(this.x + 26, this.y + 32);
        ctx.lineTo(this.x + 6, this.y + 32);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffcc99';
        ctx.fillRect(this.x + 11, this.y + 32, 3, 4);
        ctx.fillRect(this.x + 18, this.y + 32, 3, 4);
    }
}
class Item {
    constructor(type) {
        this.type = type;
        this.size = 20;
        this.spawn();
    }

    spawn() {
        let w = canvas.width > 100 ? canvas.width : 400;
        let h = canvas.height > 100 ? canvas.height : 400;
        this.x = Math.random() * (w - 80) + 40;
        this.y = Math.random() * (h - 80) + 40;
    }

    draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
        ctx.beginPath();
        ctx.arc(this.x, this.y + 6, this.size / 2, 0, Math.PI * 2);
        ctx.fill();

        if (this.type === 'food') {
            ctx.fillStyle = '#f4d03f';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#873600';
            ctx.fillRect(this.x - 3, this.y - 3, 3, 3);
            ctx.fillRect(this.x + 2, this.y - 1, 2, 2);
            ctx.fillRect(this.x - 1, this.y + 2, 3, 2);
        } else {
            ctx.fillStyle = '#3498db';
            ctx.beginPath();
            ctx.moveTo(this.x, this.y - this.size / 2);
            ctx.quadraticCurveTo(this.x + this.size / 2, this.y + this.size / 4, this.x + this.size / 2, this.y + this.size / 4);
            ctx.arc(this.x, this.y + this.size / 4, this.size / 2, 0, Math.PI);
            ctx.quadraticCurveTo(this.x - this.size / 2, this.y + this.size / 4, this.x, this.y - this.size / 2);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(this.x - 2, this.y, 2, 4);
        }
    }
}
class Pet {
    constructor(type, label, color) {
        this.type = type;
        this.label = label;
        this.color = color;
        this.x = 200;
        this.y = 200;
        this.size = 36;
        this.level = 1;

        this.foodEaten = 0;
        this.waterEaten = 0;
        
        this.state = 'wander'; 
        this.stateTimer = 0;
        this.targetX = this.x;
        this.targetY = this.y;
        this.speed = 80; 
    }

    giveResources() {
        if (this.level >= 5) return;
        
        let req = levelRequirements[this.type][this.level - 1];

        if (this.foodEaten < req.food && inventory.food > 0) {
            inventory.food--;
            this.foodEaten++;
        } 
        else if (this.waterEaten < req.water && inventory.water > 0) {
            inventory.water--;
            this.waterEaten++;
        }

        if (this.foodEaten >= req.food && this.waterEaten >= req.water) {
            this.level++;
            this.foodEaten = 0;
            this.waterEaten = 0;
            this.pickNewWanderTarget();
        }
        updateUI();
    }

    pickNewWanderTarget() {
        let padding = 40;
        this.targetX = Math.random() * (canvas.width - this.size - padding * 2) + padding;
        this.targetY = Math.random() * (canvas.height - this.size - padding * 2) + padding;
    }
        update(dt, regionFoods, regionWaters) {
        if (this.level < 2) return;

        if (this.state === 'whistled') {
            let dx = player.x - this.x;
            let dy = player.y - this.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 60) {
                this.x += (dx / dist) * this.speed * dt;
                this.y += (dy / dist) * this.speed * dt;
            }
            return;
        }

        this.stateTimer -= dt;

        if (this.state === 'idle') {
            if (this.stateTimer <= 0) {
                this.state = 'wander';
                this.pickNewWanderTarget();
            }
            return; 
        }

        if (this.state === 'wander' || this.state === 'forage') {
            let targetItem = null;
            let minDist = 250; 

            regionFoods.forEach(f => {
                let d = Math.sqrt((f.x - this.x)**2 + (f.y - this.y)**2);
                if (d < minDist) { minDist = d; targetItem = { item: f, type: 'food', list: regionFoods }; }
            });
            regionWaters.forEach(w => {
                let d = Math.sqrt((w.x - this.x)**2 + (w.y - this.y)**2);
                if (d < minDist) { minDist = d; targetItem = { item: w, type: 'water', list: regionWaters }; }
            });

            if (targetItem) {
                this.state = 'forage';
                this.targetX = targetItem.item.x - this.size / 2;
                this.targetY = targetItem.item.y - this.size / 2;
                
                let dx = this.targetX - this.x;
                let dy = this.targetY - this.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 15) {
                    let idx = targetItem.list.indexOf(targetItem.item);
                    if (idx > -1) {
                        targetItem.list.splice(idx, 1);
                        respawnQueue.push({ type: targetItem.type, time: Date.now() + 10000 });
                        
                        if (this.type === 'elephant') {
                            if (targetItem.type === 'food') inventory.food += 2;
                            else inventory.water += 3;
                        } else if (this.type === 'squirrel') {
                            if (targetItem.type === 'food') inventory.food += 2;
                        } else {
                            if (targetItem.type === 'food') inventory.food++;
                            else inventory.water++;
                        }
                        updateUI();
                    }
                    this.state = 'idle';
                    this.stateTimer = Math.random() * 2 + 1; 
                    return;
                }
            } else if (this.state === 'forage') {
                this.state = 'wander';
                this.pickNewWanderTarget();
            }

            let dx = this.targetX - this.x;
            let dy = this.targetY - this.y;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > 5) {
                this.x += (dx / dist) * this.speed * dt;
                this.y += (dy / dist) * this.speed * dt;
            } else if (this.state === 'wander') {
                this.state = 'idle';
                this.stateTimer = Math.random() * 3 + 1; 
            }
        }
    }


    draw() {

        if (this.type === 'dog') {
            ctx.fillStyle = '#f1c40f'; 
            ctx.fillRect(this.x + 4, this.y + 10, 26, 16); 
            ctx.fillRect(this.x + 18, this.y + 2, 10, 10); 
            ctx.fillStyle = '#f39c12'; 
            ctx.fillRect(this.x + 16, this.y + 4, 4, 8);  
            ctx.fillStyle = '#000000'; 
            ctx.fillRect(this.x + 25, this.y + 4, 2, 2);   
            ctx.fillRect(this.x + 27, this.y + 6, 2, 2);   
            ctx.fillStyle = '#d35400'; 
            ctx.fillRect(this.x + 6, this.y + 26, 4, 6);   
            ctx.fillRect(this.x + 22, this.y + 26, 4, 6);
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.moveTo(this.x + 4, this.y + 12);
            ctx.quadraticCurveTo(this.x - 6, this.y + 4, this.x - 4, this.y);
            ctx.lineTo(this.x - 1, this.y + 1);
            ctx.quadraticCurveTo(this.x - 3, this.y + 6, this.x + 6, this.y + 14);
            ctx.closePath();
            ctx.fill();
        } 
        else if (this.type === 'elephant') {
            ctx.fillStyle = '#95a5a6'; 
            ctx.fillRect(this.x + 6, this.y + 8, 24, 18);  
            ctx.fillRect(this.x + 22, this.y + 2, 10, 10);     
            ctx.fillStyle = '#7f8c8d'; 
            ctx.fillRect(this.x + 18, this.y + 4, 6, 10);  
            ctx.fillStyle = '#000000'; 
            ctx.fillRect(this.x + 28, this.y + 4, 2, 2);   
            ctx.fillStyle = '#7f8c8d'; 
            ctx.fillRect(this.x + 8, this.y + 26, 5, 6);   
            ctx.fillRect(this.x + 20, this.y + 26, 5, 6);
            ctx.fillRect(this.x + 5, this.y + 14, 2, 6);
            ctx.fillStyle = '#95a5a6';
            ctx.beginPath();
            ctx.moveTo(this.x + 30, this.y + 10);
            ctx.lineTo(this.x + 35, this.y + 18);
            ctx.lineTo(this.x + 33, this.y + 19);
            ctx.lineTo(this.x + 29, this.y + 12);
            ctx.closePath();
            ctx.fill();
        } 
        else if (this.type === 'squirrel') {
            ctx.fillStyle = this.color; 
            ctx.fillRect(this.x + 8, this.y + 14, 16, 12);  
            ctx.fillRect(this.x + 14, this.y + 6, 10, 10);  
            ctx.fillRect(this.x + 20, this.y + 2, 2, 4);       
            ctx.fillStyle = '#000000'; 
            ctx.fillRect(this.x + 20, this.y + 8, 2, 2);   
            ctx.fillStyle = this.color === '#d35400' ? '#7f8c8d' : '#3d1d00';
            ctx.fillRect(this.x + 10, this.y + 26, 3, 4);  
            ctx.fillRect(this.x + 18, this.y + 26, 3, 4);
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.moveTo(this.x + 10, this.y + 24);
            ctx.quadraticCurveTo(this.x + 2, this.y + 16, this.x + 4, this.y + 6);
            ctx.quadraticCurveTo(this.x + 10, this.y + 8, this.x + 12, this.y + 18);
            ctx.closePath();
            ctx.fill();
        }

        ctx.fillStyle = '#fff';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        
        let text = `${this.label} Lv.${this.level}`;
        if (this.level >= 5) {
            text += ' [MAX]';
        } else if (this.level > 1) {
            text += ` [${this.state.toUpperCase()}]`;
        }
        ctx.fillText(text, this.x + (this.size / 2), this.y - 16);

        if (this.level < 5) {
            let req = levelRequirements[this.type][this.level - 1];
            let totalNeeded = req.food + req.water;
            let totalEaten = this.foodEaten + this.waterEaten;
            let progressRatio = totalEaten / totalNeeded;

            let barWidth = this.size + 8;
            let barHeight = 4;
            let barX = this.x + (this.size / 2) - (barWidth / 2);
            let barY = this.y - 10;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(barX, barY, barWidth, barHeight);

            let grad = ctx.createLinearGradient(barX, 0, barX + barWidth, 0);
            grad.addColorStop(0, '#e67e22');
            grad.addColorStop(1, '#f1c40f');

            ctx.fillStyle = grad;
            ctx.fillRect(barX, barY, barWidth * progressRatio, barHeight);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1;
            ctx.strokeRect(barX, barY, barWidth, barHeight);
        }


    }
}

const player = new Player(100, 100);
const respawnQueue = [];

const regionalItems = {
    1: { foods: [], waters: [] },
    2: { foods: [], waters: [] },
    3: { foods: [], waters: [] }
};

let foods = regionalItems[currentRegion].foods;
let waters = regionalItems[currentRegion].waters;

const petsByRegion = {
    1: [new Pet('dog', 'Retriever', '#f1c40f')],
    2: [new Pet('elephant', 'Elephant', '#95a5a6')],
    3: [
        new Pet('squirrel', 'Squirrel A', '#d35400'),
        (() => {
            let p = new Pet('squirrel', 'Squirrel B', '#5a2a00');
            p.x = 260;
            p.y = 200;
            return p;
        })()
    ]
};

function resizeCanvas() {
    const parent = canvas.parentElement;
    canvas.width = parent.clientWidth;
    canvas.height = parent.clientHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function checkCollisions() {
    for (let i = foods.length - 1; i >= 0; i--) {
        let f = foods[i];
        if (player.x < f.x + 10 && player.x + player.size > f.x - 10 &&
            player.y < f.y + 10 && player.y + player.size > f.y - 10) {
            foods.splice(i, 1);
            inventory.food++;
            updateUI();
            respawnQueue.push({ type: 'food', time: Date.now() + 10000 });
        }
    }

    for (let i = waters.length - 1; i >= 0; i--) {
        let w = waters[i];
        if (player.x < w.x + 10 && player.x + player.size > w.x - 10 &&
            player.y < w.y + 10 && player.y + player.size > w.y - 10) {
            waters.splice(i, 1);
            inventory.water++;
            updateUI();
            respawnQueue.push({ type: 'water', time: Date.now() + 10000 });
        }
    }
}

function processSpawns(dt) {
    let now = Date.now();
    
    for (let i = respawnQueue.length - 1; i >= 0; i--) {
        if (now >= respawnQueue[i].time) {
            for (let r = 1; r <= 3; r++) {
                let rItems = regionalItems[r];
                if (respawnQueue[i].type === 'food' && rItems.foods.length < 5) {
                    rItems.foods.push(new Item('food'));
                    break;
                } else if (respawnQueue[i].type === 'water' && rItems.waters.length < 5) {
                    rItems.waters.push(new Item('water'));
                    break;
                }
            }
            respawnQueue.splice(i, 1);
        }
    }

    spawnTimer += dt;
    if (spawnTimer >= 10) {
        for (let r = 1; r <= 3; r++) {
            if (regionalItems[r].foods.length < 5) regionalItems[r].foods.push(new Item('food'));
            if (regionalItems[r].waters.length < 5) regionalItems[r].waters.push(new Item('water'));
        }
        spawnTimer = 0;
    }
}

function bindInput(elementId, action) {
    const el = document.getElementById(elementId);
    
    el.addEventListener('touchstart', (e) => {
        e.preventDefault();
        input[action] = true;
    }, { passive: false });
    
    el.addEventListener('touchend', (e) => {
        e.preventDefault();
        input[action] = false;
    }, { passive: false });

    el.addEventListener('mousedown', () => { input[action] = true; });
    el.addEventListener('mouseup', () => { input[action] = false; });
    el.addEventListener('mouseleave', () => { input[action] = false; });
}

bindInput('btnUp', 'up');
bindInput('btnDown', 'down');
bindInput('btnLeft', 'left');
bindInput('btnRight', 'right');

const whistleBtn = document.getElementById('whistleBtn');
whistleBtn.addEventListener('click', () => {
    let activePets = petsByRegion[currentRegion];
    if (!Array.isArray(activePets)) return;

    activePets.forEach(pet => {
        if (pet.level < 2) return;

        if (pet.state !== 'whistled') {
            pet.state = 'whistled';
            whistleBtn.textContent = 'RETURN';
        } else {
            pet.state = 'wander';
            pet.pickNewWanderTarget();
            whistleBtn.textContent = 'WHISTLE';
        }
    });
});


const handleInteract = (e) => {
    if(e) e.preventDefault();
    let activePets = petsByRegion[currentRegion];
    if (Array.isArray(activePets)) {
        activePets.forEach(pet => {
            let dx = (pet.x + pet.size/2) - (player.x + player.size/2);
            let dy = (pet.y + pet.size/2) - (player.y + player.size/2);
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 80) {
                pet.giveResources();
            }
        });
    }
};

document.getElementById('interactBtn').addEventListener('touchstart', handleInteract, {passive:false});
document.getElementById('interactBtn').addEventListener('mousedown', handleInteract);

window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w') input.up = true;
    if (e.key === 'ArrowDown' || e.key === 's') input.down = true;
    if (e.key === 'ArrowLeft' || e.key === 'a') input.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') input.right = true;
    if (e.key === ' ' || e.key === 'e') handleInteract();
});

window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w') input.up = false;
    if (e.key === 'ArrowDown' || e.key === 's') input.down = false;
    if (e.key === 'ArrowLeft' || e.key === 'a') input.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') input.right = false;
});

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let elapsed = timestamp - lastTime;

    if (elapsed >= frameInterval) {
        let dt = elapsed / 1000;
        if (dt > 0.1) dt = 0.1; 
        lastTime = timestamp - (elapsed % frameInterval);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (currentRegion === 1) {
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#2ecc71';
            for (let x = 40; x < canvas.width; x += 80) {
                for (let y = 40; y < canvas.height; y += 80) {
                    ctx.fillRect(x, y, 4, 12);
                    ctx.fillRect(x + 8, y + 4, 4, 8);
                }
            }
        } else if (currentRegion === 2) {
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#e67e22';
            for (let x = 30; x < canvas.width; x += 70) {
                for (let y = 50; y < canvas.height; y += 70) {
                    ctx.fillRect(x, y, 6, 6);
                    ctx.fillRect(x + 12, y + 10, 4, 4);
                }
            }
        } else if (currentRegion === 3) {
            ctx.fillStyle = '#1e824c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#3e2723';
            for (let x = 50; x < canvas.width; x += 90) {
                for (let y = 30; y < canvas.height; y += 90) {
                    ctx.fillRect(x, y, 8, 4);
                    ctx.fillRect(x + 15, y + 8, 4, 4);
                }
            }
        }

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

        processSpawns(dt);
        player.update(dt);
        checkCollisions();

        foods.forEach(f => f.draw());
        waters.forEach(w => w.draw());

        for (let r = 1; r <= 3; r++) {
            let activePets = petsByRegion[r];
            if (Array.isArray(activePets)) {
                activePets.forEach(pet => {
                    pet.update(dt, regionalItems[r].foods, regionalItems[r].waters);
                    if (r === currentRegion) {
                        pet.draw();
                    }
                });
            }
        }


        player.draw();
    }
    requestAnimationFrame(gameLoop);
}

function renderMiniPet(pet, elementId) {
    const miniCanvas = document.getElementById(elementId);
    const mctx = miniCanvas.getContext('2d');
    miniCanvas.width = 70;
    miniCanvas.height = 70;
    mctx.clearRect(0, 0, 70, 70);
    
    if (pet.level < 2) {
        mctx.fillStyle = '#111';
        mctx.fillRect(0, 0, 70, 70);
        mctx.fillStyle = 'rgba(255,255,255,0.1)';
        mctx.font = '24px monospace';
        mctx.textAlign = 'center';
        mctx.textBaseline = 'middle';
        mctx.fillText('?', 35, 35);
    } else {
        mctx.fillStyle = 'rgba(255,255,255,0.1)';
        mctx.fillRect(0, 0, 70, 70);

        let ox = 17;
        let oy = 17;

        if (pet.type === 'dog') {
            mctx.fillStyle = '#f1c40f'; 
            mctx.fillRect(ox + 4, oy + 10, 26, 16); 
            mctx.fillRect(ox + 18, oy + 2, 10, 10); 
            mctx.fillStyle = '#f39c12'; 
            mctx.fillRect(ox + 16, oy + 4, 4, 8);  
            mctx.fillStyle = '#000000'; 
            mctx.fillRect(ox + 25, oy + 4, 2, 2);   
            mctx.fillRect(ox + 27, oy + 6, 2, 2);   
            mctx.fillStyle = '#d35400'; 
            mctx.fillRect(ox + 6, oy + 26, 4, 6);   
            mctx.fillRect(ox + 22, oy + 26, 4, 6);
            mctx.fillStyle = '#f1c40f';
            mctx.beginPath();
            mctx.moveTo(ox + 4, oy + 12);
            mctx.quadraticCurveTo(ox - 6, oy + 4, ox - 4, oy);
            mctx.lineTo(ox - 1, oy + 1);
            mctx.quadraticCurveTo(ox - 3, oy + 6, ox + 6, oy + 14);
            mctx.closePath();
            mctx.fill();
        } 
        else if (pet.type === 'elephant') {
            mctx.fillStyle = '#95a5a6'; 
            mctx.fillRect(ox + 6, oy + 8, 24, 18);  
            mctx.fillRect(ox + 22, oy + 2, 10, 10);     
            mctx.fillStyle = '#7f8c8d'; 
            mctx.fillRect(ox + 18, oy + 4, 6, 10);  
            mctx.fillStyle = '#000000'; 
            mctx.fillRect(ox + 28, oy + 4, 2, 2);   
            mctx.fillStyle = '#7f8c8d'; 
            mctx.fillRect(ox + 8, oy + 26, 5, 6);   
            mctx.fillRect(ox + 20, oy + 26, 5, 6);
            mctx.fillRect(ox + 5, oy + 14, 2, 6);
            mctx.fillStyle = '#95a5a6';
            mctx.beginPath();
            mctx.moveTo(ox + 30, oy + 10);
            mctx.lineTo(ox + 35, oy + 18);
            mctx.lineTo(ox + 33, oy + 19);
            mctx.lineTo(ox + 29, oy + 12);
            mctx.closePath();
            mctx.fill();
        } 
        else if (pet.type === 'squirrel') {
            mctx.fillStyle = pet.color; 
            mctx.fillRect(ox + 8, oy + 14, 16, 12);  
            mctx.fillRect(ox + 14, oy + 6, 10, 10);  
            mctx.fillRect(ox + 20, oy + 2, 2, 4);       
            mctx.fillStyle = '#000000'; 
            mctx.fillRect(ox + 20, oy + 8, 2, 2);   
            mctx.fillStyle = pet.color === '#d35400' ? '#7f8c8d' : '#3d1d00';
            mctx.fillRect(ox + 10, oy + 26, 3, 4);  
            mctx.fillRect(ox + 18, oy + 26, 3, 4);
            mctx.fillStyle = pet.color;
            mctx.beginPath();
            mctx.moveTo(ox + 10, oy + 24);
            mctx.quadraticCurveTo(ox + 2, oy + 16, ox + 4, oy + 6);
            mctx.quadraticCurveTo(ox + 10, oy + 8, ox + 12, oy + 18);
            mctx.closePath();
            mctx.fill();
        }
    }
}
