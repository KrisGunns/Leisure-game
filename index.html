<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Just a little leisure</title>
    <link rel="stylesheet" href="style.css?v=1.1">
</head>
<body>
    <div id="gameContainer">
        <!-- Pinned Core Actionable Resource Top Bar View -->
<!-- Stacked Core Actionable Resource Top Bar View -->
<!-- Stacked Core Actionable Resource Top Bar View -->
<div id="topBar">
    <div class="hudResourceBlock">
        <span class="hudRow">🍪 Food: <span id="lblFood">0</span></span>
        <br>
        <span class="hudRow">💧 Water: <span id="lblWater">0</span></span>
    </div>
    
    <!-- NEW: Player Level Progress Badge Center Anchor -->
    <div id="playerLevelBadge" style="text-align: center; font-family: monospace; font-size: 11px; background: rgba(255,255,255,0.05); padding: 4px 8px; border: 1px solid #444; border-radius: 6px; position: relative; overflow: hidden;">
        <div id="charXPBarFill" class="charXPBarFill"></div>
        <div class="charBadgeContent">
            ⭐ <strong style="color: #f1c40f;">LV.<span id="charLevel">1</span></strong>
            <br>
            <span style="color: #ffffff; font-size: 9px; font-weight: bold;"><span id="charXP">0</span>/<span id="charNextXP">100</span> XP</span>
        </div>
    </div>

    <div>
        🗺️ <select id="regionSelector">
            <option value="1">Region 1</option>
            <option value="2">Region 2</option>
            <option value="3">Region 3</option>
            <option value="4">Region 4</option>
            <option value="5">Region 5</option>
        </select>
    </div>
</div>

<div id="canvasWrapper">
    <canvas id="gameCanvas"></canvas>

    <button id="openMenuBtn" class="utilBtn">☰ MENU</button>
    <button id="settingsBtn" class="utilBtn">⚙️</button>
    
    <!-- FIXED: Removed inline positioning coordinates so it maps cleanly to your right-side style.css parameters! -->
    <button id="spawnBeeBtn" class="utilBtn" style="display: none; background: #fbbf24; border-color: #f59e0b; color: #000;">🐝 Buy Bee (10🪙)</button>
    <div id="hiveHoneyLabel" class="utilBtn" style="display: none; background: #fff3cd; border-color: #f59e0b; color: #7a5c00; text-align: center; pointer-events: none;"></div>
    
    <button id="whistleBtn" class="utilBtn">WHISTLE</button>

        <!-- Repositioned & Cleaned Inventory Storage Overlay Sheet -->
    <div id="bagOverlay" class="modalOverlay" style="display: none;">
        <div class="modalHeader">
            <h2>🎒 INVENTORY</h2>
            <button id="bagClose" class="modalCloseBtn">X</button>
        </div>
        <div id="bagContentList">
            <div class="bagItemRow"><span>🪙 Gold Coins:</span><strong id="bagCoins">0</strong></div>
            <div class="bagItemRow"><span>🥚 Eggs:</span><strong id="bagEggs">0</strong></div>
            <div class="bagItemRow"><span>🍯 Wild Honey:</span><strong id="bagHoney">0</strong></div>
            <div class="bagItemRow"><span>🐟 Fish:</span><strong id="bagFish">0</strong></div>
            <div class="bagItemRow"><span>🍌 Bananas:</span><strong id="bagBananas">0</strong></div>
        </div>
    </div>

    <div id="characterOverlay" style="display: none;">
        <div id="characterHeader">
            <h2>🧑 CHARACTER</h2>
            <button id="characterClose">X</button>
        </div>
        <div id="characterContent">
            <div id="characterNameRow" class="codexEntry" style="justify-content: space-between;">
                <div>
                    <strong id="characterNameDisplay" style="font-size: 15px; color: #f1c40f;"></strong><br>
                    <span style="color: #95a5a6; font-size: 11px;">Level <span id="characterLevelValue">1</span></span>
                </div>
                <div id="characterRenameBox" style="display: flex; gap: 6px;">
                    <input type="text" id="characterNameInput" placeholder="New Name" style="width: 90px; font-size: 11px;">
                    <button id="btnRenameCharacter" style="font-size: 11px; padding: 4px 8px;">Set</button>
                </div>
            </div>

            <div id="characterBonusSection" class="codexEntry" style="flex-direction: column; align-items: stretch; gap: 4px;">
                <strong style="color: #f1c40f;">Active Bonuses</strong>
                <div id="characterBonusList" style="font-size: 12px; line-height: 1.6;"></div>
            </div>

            <div id="characterPerksSection" class="codexEntry" style="flex-direction: column; align-items: stretch; gap: 4px;">
                <strong style="color: #f1c40f;">Level-Up Perks</strong>
                <ul id="characterPerksList" style="padding-left: 18px; margin: 4px 0 0 0; font-size: 12px; line-height: 1.6;"></ul>
            </div>
        </div>
    </div>

    <div id="devPanel">
        <div style="display: flex; justify-content: space-between; font-weight: bold; border-bottom: 1px solid #444; padding-bottom: 4px;">
            <span>🛠️ DEV CONSOLE</span>
            <span id="closeDev" style="color: #e74c3c; cursor: pointer;">[X]</span>
        </div>
        <div class="devRow">
            <button id="devAddFood" class="devBtn">+50 FOOD</button>
            <button id="devAddWater" class="devBtn">+50 WATER</button>
        </div>
        <button id="devInstaTame" class="devBtn" style="background: #27ae60;">⭐ INSTA-TAME / LEVEL UP</button>
        <button id="devWipeSave" class="devBtn" style="background: #7f8c8d; margin-top: 5px;">⚠️ WIPE SAVE PROGRESS</button>
    </div>

            <div id="joystickContainer">

            <div id="interactBtn">GIVE</div>
        </div>

        <!-- Consolidated MENU overlay: opened from the single MENU button (where the
             PETS button used to sit). Sized to the entire game screen (covers the
             topBar too, not just the canvas) so nothing of the game is visible while
             it's open, even though the game itself keeps running/foraging behind it.
             Reuses the existing PETS/BAG/CHAR buttons (same ids), so opening any of
             them still opens that screen exactly as before, layered on top of this
             menu — closing that screen returns to the menu underneath. -->
        <div id="menuOverlay" style="display: none;">
            <div id="menuHeader">
                <h2>☰ MENU</h2>
                <button id="menuClose">X</button>
            </div>
            <div id="menuButtonList">
                <button id="openCodexBtn" class="menuBtn">🐾 PETS</button>
                <button id="openBagBtn" class="menuBtn">🎒 BAG</button>
                <button id="openCharacterBtn" class="menuBtn">🧑 CHAR</button>
            </div>
