<!-- Game Build Pipeline Update -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Just a little leisure</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: monospace;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        #topBar {
            background: #222;
            color: #fff;
            padding: 10px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 14px;
            border-bottom: 2px solid #444;
            z-index: 10;
        }
        #regionSelector {
            background: #444;
            color: #fff;
            border: 1px solid #666;
            padding: 4px 8px;
            font-family: monospace;
            font-size: 14px;
            outline: none;
        }
        #canvasWrapper {
            flex: 1;
            position: relative;
            background: #2c3e50;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #dpad {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 160px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            z-index: 10;
        }
        .dbtn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .dbtn:active {
            background: rgba(255, 255, 255, 0.5);
        }
        #btnUp { grid-column: 2; grid-row: 1; }
        #btnLeft { grid-column: 1; grid-row: 2; }
        #btnRight { grid-column: 3; grid-row: 2; }
        #btnDown { grid-column: 2; grid-row: 3; }
        #interactBtn {
            position: absolute;
            bottom: 30px;
            right: 20px;
            width: 70px;
            height: 70px;
            background: rgba(230, 126, 34, 0.8);
            border: 2px solid #d35400;
            border-radius: 50%;
            color: white;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #interactBtn:active {
            background: rgba(211, 84, 0, 1);
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="topBar">
        <div>🎒 Cookies: <span id="lblFood">0</span> | Water: <span id="lblWater">0</span></div>
        <div>
            🗺️ <select id="regionSelector">
                <option value="1">Region 1 (Dog)</option>
                <option value="2">Region 2 (Elephant)</option>
                <option value="3">Region 3 (Squirrels)</option>
            </select>
        </div>
    </div>
    <div id="canvasWrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="dpad">
            <div id="btnUp" class="dbtn">▲</div>
            <div id="btnLeft" class="dbtn">◀</div>
            <div id="btnRight" class="dbtn">▶</div>
            <div id="btnDown" class="dbtn">▼</div>
        </div>
        <div id="interactBtn">GIVE</div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const lblFood = document.getElementById('lblFood');
const lblWater = document.getElementById('lblWater');
const regionSelector = document.getElementById('regionSelector');

let currentRegion = 1;
let lastTime = 0;
const targetFPS = 60;
const frameInterval = 1000 / targetFPS;

const input = { up: false, down: false, left: false, right: false };
const inventory = { food: 0, water: 0 };

function updateUI() {
    lblFood.textContent = inventory.food;
    lblWater.textContent = inventory.water;
}

class Player {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = 32;
        this.speed = 180;
    }

    update(dt) {
        let dx = 0;
        let dy = 0;
        if (input.up) dy -= 1;
        if (input.down) dy += 1;
        if (input.left) dx -= 1;
        if (input.right) dx += 1;

        if (dx !== 0 && dy !== 0) {
            dx *= 0.7071;
            dy *= 0.7071;
        }

        let nextX = this.x + dx * this.speed * dt;
        let nextY = this.y + dy * this.speed * dt;

        let padding = 30; 
        if (nextX >= padding && nextX <= canvas.width - this.size - padding) {
            this.x = nextX;
        }
        if (nextY >= padding && nextY <= canvas.height - this.size - padding) {
            this.y = nextY;
        }
    }

    draw() {
        ctx.fillStyle = '#ff7979';
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.fillStyle = '#f9ca24';
        ctx.fillRect(this.x, this.y, this.size, 8);
        ctx.fillStyle = '#000';
        ctx.fillRect(this.x + 6, this.y + 12, 4, 4);
        ctx.fillRect(this.x + 22, this.y + 12, 4, 4);
        ctx.fillStyle = '#badc58';
        ctx.fillRect(this.x, this.y + 20, this.size, this.size - 20);
    }
}

class Item {
    constructor(type) {
        this.type = type;
        this.size = 20;
        this.spawn();
    }

    spawn() {
        let w = canvas.width > 100 ? canvas.width : 400;
        let h = canvas.height > 100 ? canvas.height : 400;
        this.x = Math.random() * (w - 80) + 40;
        this.y = Math.random() * (h - 80) + 40;
    }

    draw() {
        if (this.type === 'food') {
            ctx.fillStyle = '#d35400';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(this.x - 4, this.y - 4, 2, 2);
            ctx.fillRect(this.x + 2, this.y - 2, 2, 2);
            ctx.fillRect(this.x - 2, this.y + 3, 2, 2);
        } else {
            ctx.fillStyle = '#3498db';
            ctx.beginPath();
            ctx.moveTo(this.x, this.y - this.size / 2);
            ctx.lineTo(this.x + this.size / 2, this.y + this.size / 2);
            ctx.lineTo(this.x - this.size / 2, this.y + this.size / 2);
            ctx.closePath();
            ctx.fill();
        }
    }
}

class Pet {
    constructor(type, label, color) {
        this.type = type;
        this.label = label;
        this.color = color;
        this.x = 200;
        this.y = 200;
        this.size = 36;
        this.level = 1;
        this.exp = 0;
        
        this.state = 'wander'; // 'wander', 'idle', 'forage'
        this.stateTimer = 0;
        this.targetX = this.x;
        this.targetY = this.y;
        this.speed = 80; 
    }

    giveResources() {
        if (this.level >= 2) return;
        if (inventory.food > 0 || inventory.water > 0) {
            if (inventory.food > 0) { inventory.food--; this.exp++; }
            else if (inventory.water > 0) { inventory.water--; this.exp++; }
            
            if (this.exp >= 10) {
                this.level = 2;
                this.pickNewWanderTarget();
            }
            updateUI();
        }
    }

    pickNewWanderTarget() {
        let padding = 40;
        this.targetX = Math.random() * (canvas.width - this.size - padding * 2) + padding;
        this.targetY = Math.random() * (canvas.height - this.size - padding * 2) + padding;
    }

    update(dt, regionFoods, regionWaters) {
        if (this.level < 2) return;

        this.stateTimer -= dt;

        if (this.state === 'idle') {
            if (this.stateTimer <= 0) {
                this.state = 'wander';
                this.pickNewWanderTarget();
            }
            return; 
        }

        if (this.state === 'wander' || this.state === 'forage') {
            let targetItem = null;
            let minDist = 250; 

            regionFoods.forEach(f => {
                let d = Math.sqrt((f.x - this.x)**2 + (f.y - this.y)**2);
                if (d < minDist) { minDist = d; targetItem = { item: f, type: 'food', list: regionFoods }; }
            });
            regionWaters.forEach(w => {
                let d = Math.sqrt((w.x - this.x)**2 + (w.y - this.y)**2);
                if (d < minDist) { minDist = d; targetItem = { item: w, type: 'water', list: regionWaters }; }
            });

            if (targetItem) {
                this.state = 'forage';
                this.targetX = targetItem.item.x - this.size / 2;
                this.targetY = targetItem.item.y - this.size / 2;
                
                let dx = this.targetX - this.x;
                let dy = this.targetY - this.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 15) {
                    let idx = targetItem.list.indexOf(targetItem.item);
                    if (idx > -1) {
                        targetItem.list.splice(idx, 1);
                        respawnQueue.push({ type: targetItem.type, time: Date.now() + 10000 });
                        
                        if (Math.random() < 0.20) {
                            // Pet eats it (20% chance)
                        } else {
                            if (targetItem.type === 'food') inventory.food++;
                            else inventory.water++;
                            updateUI();
                        }
                    }
                    this.state = 'idle';
                    this.stateTimer = Math.random() * 2 + 1; // 1-3 sec break
                    return;
                }
            } else if (this.state === 'forage') {
                this.state = 'wander';
                this.pickNewWanderTarget();
            }

            let dx = this.targetX - this.x;
            let dy = this.targetY - this.y;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > 5) {
                this.x += (dx / dist) * this.speed * dt;
                this.y += (dy / dist) * this.speed * dt;
            } else if (this.state === 'wander') {
                this.state = 'idle';
                this.stateTimer = Math.random() * 3 + 1; // 1-4 sec break
            }
        }
    }

    draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        
        ctx.fillStyle = '#fff';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        let text = `${this.label} Lv.${this.level}`;
        if (this.level < 2) text += ` (${this.exp}/10)`;
        else text += ` [${this.state.toUpperCase()}]`;
        ctx.fillText(text, this.x + this.size / 2, this.y - 8);
    }
}

const player = new Player(100, 100);
const foods = [];
const waters = [];
const respawnQueue = [];

const petsByRegion = {
    1: [new Pet('dog', 'Retriever', '#f1c40f')],
    2: [new Pet('elephant', 'Elephant', '#95a5a6')],
    3: [new Pet('squirrel', 'Squirrel A', '#e67e22'), new Pet('squirrel', 'Squirrel B', '#d35400')]
};

function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function checkCollisions() {
    for (let i = foods.length - 1; i >= 0; i--) {
        let f = foods[i];
        if (player.x < f.x + 10 && player.x + player.size > f.x - 10 &&
            player.y < f.y + 10 && player.y + player.size > f.y - 10) {
            foods.splice(i, 1);
            inventory.food++;
            updateUI();
            respawnQueue.push({ type: 'food', time: Date.now() + 10000 });
        }
    }

    for (let i = waters.length - 1; i >= 0; i--) {
        let w = waters[i];
        if (player.x < w.x + 10 && player.x + player.size > w.x - 10 &&
            player.y < w.y + 10 && player.y + player.size > w.y - 10) {
            waters.splice(i, 1);
            inventory.water++;
            updateUI();
            respawnQueue.push({ type: 'water', time: Date.now() + 10000 });
        }
    }
}

function processSpawns() {
    let now = Date.now();
    for (let i = respawnQueue.length - 1; i >= 0; i--) {
        if (now >= respawnQueue[i].time) {
            if (respawnQueue[i].type === 'food' && foods.length < 10) {
                foods.push(new Item('food'));
            } else if (respawnQueue[i].type === 'water' && waters.length < 10) {
                waters.push(new Item('water'));
            }
            respawnQueue.splice(i, 1);
        }
    }

    while (foods.length < 10) foods.push(new Item('food'));
    while (waters.length < 10) waters.push(new Item('water'));
}

function bindInput(elementId, action) {
    const el = document.getElementById(elementId);
    
    el.addEventListener('touchstart', (e) => {
        e.preventDefault();
        input[action] = true;
    }, { passive: false });
    
    el.addEventListener('touchend', (e) => {
        e.preventDefault();
        input[action] = false;
    }, { passive: false });

    el.addEventListener('mousedown', () => { input[action] = true; });
    el.addEventListener('mouseup', () => { input[action] = false; });
    el.addEventListener('mouseleave', () => { input[action] = false; });
}

bindInput('btnUp', 'up');
bindInput('btnDown', 'down');
bindInput('btnLeft', 'left');
bindInput('btnRight', 'right');

const handleInteract = (e) => {
    if(e) e.preventDefault();
    let activePets = petsByRegion[currentRegion];
    if (Array.isArray(activePets)) {
        activePets.forEach(pet => {
            let dx = (pet.x + pet.size/2) - (player.x + player.size/2);
            let dy = (pet.y + pet.size/2) - (player.y + player.size/2);
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 80) {
                pet.giveResources();
            }
        });
    }
};

document.getElementById('interactBtn').addEventListener('touchstart', handleInteract, {passive:false});
document.getElementById('interactBtn').addEventListener('mousedown', handleInteract);

window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w') input.up = true;
    if (e.key === 'ArrowDown' || e.key === 's') input.down = true;
    if (e.key === 'ArrowLeft' || e.key === 'a') input.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') input.right = true;
    if (e.key === ' ' || e.key === 'e') handleInteract();
});

window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w') input.up = false;
    if (e.key === 'ArrowDown' || e.key === 's') input.down = false;
    if (e.key === 'ArrowLeft' || e.key === 'a') input.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') input.right = false;
});

regionSelector.addEventListener('change', (e) => {
    currentRegion = parseInt(e.target.value);
    foods.length = 0;
    waters.length = 0;
    respawnQueue.length = 0;
});

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let elapsed = timestamp - lastTime;

    if (elapsed >= frameInterval) {
        let dt = elapsed / 1000;
        if (dt > 0.1) dt = 0.1; 
        lastTime = timestamp - (elapsed % frameInterval);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#7f8c8d';
        ctx.lineWidth = 4;
        ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

        processSpawns();
        player.update(dt);
        checkCollisions();

        foods.forEach(f => f.draw());
        waters.forEach(w => w.draw());

        let activePets = petsByRegion[currentRegion];
        if (Array.isArray(activePets)) {
            activePets.forEach(pet => {
                pet.update(dt, foods, waters);
                pet.draw();
            });
        }

        for (let r in petsByRegion) {
            if (parseInt(r) !== currentRegion) {
                let backgroundPets = petsByRegion[r];
                if (Array.isArray(backgroundPets)) {
                    backgroundPets.forEach(pet => {
                        if (pet.level >= 2) {
                            pet.update(dt, [], []);
                        }
                    });
                }
            }
        }
        
        player.draw();
    }
    requestAnimationFrame(gameLoop);
}

updateUI();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
